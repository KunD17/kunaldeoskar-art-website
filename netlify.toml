# Tells Netlify how to build the site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Optimised images and CSS/JS have unique names that change when their content
# changes, so browsers can safely keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
